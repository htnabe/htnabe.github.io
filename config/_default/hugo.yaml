baseURL: "https://htnabe.github.io/"
title: "T-Pot"
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
timeZone: "Asia/Tokyo"

build:
  writeStats: true

defaultContentLanguage: "ja"
defaultContentLanguageInSubdir: false

languages:
  ja:
    contentDir: content/ja
    locale: "ja-JP"
    label: "日本語"
    weight: 1
    menus:
      main:
        - name: Home
          url: /
          weight: 10
        - name: About
          url: /about/
          weight: 20
        - name: Author
          url: /author/
          weight: 30
    params:
      description: "私生活で得られたTipsから、使ってみて便利だった道具・アプリケーション開発に関するHowTo等をまとめています。"
      algolia:
        indexName: "nabeBlog"
  en:
    contentDir: content/en
    locale: "en-US"
    label: "English"
    weight: 2
    menus:
      main:
        - name: Home
          url: /en/
          weight: 10
        - name: About
          url: /en/about/
          weight: 20
        - name: Author
          url: /en/author/
          weight: 30
    params:
      description: "I share practical tips from daily life, useful tools, and application development how-tos."
      author:
        comment: "Kobe has started to feel familiar. I enjoy running and cycling at a relaxed pace."
        career:
          - year: "2020"
            title: "JSME Chugoku-Shikoku Branch 58th General Meeting and Lecture"
